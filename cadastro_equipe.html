<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Equipe - Sport Match</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
</head>
<body>

<div class="app-container">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="index.html" class="logo">
                <img src="../assets/logo.jpeg" alt="Logosportmatch" style="height: 40px; width: auto;"> 
                <span>SPORT MATCH</span>
            </a>
        </div>
        <div class="sidebar-profile" id="sidebarProfile">
            <div class="sidebar-avatar" id="sidebarAvatar">👤</div>
            <h3 id="sidebarNome">Visitante</h3>
            <p id="sidebarEmail">Faça login para acessar</p>
        </div>
        <nav class="sidebar-nav">
            <a href="index.html" class="nav-item">📊 Dashboard</a>
            <a href="atletas.html" class="nav-item">👥 Atletas</a>
            <a href="equipes.html" class="nav-item">🏢 Equipes</a>
            <a href="vagas.html" class="nav-item">📋 Vagas</a>
            <a href="login.html" class="nav-item">🔑 Login</a>
            <a href="cadastro_atleta.html" class="nav-item">📝 Cadastro</a>
        </nav>
        <div class="sidebar-notifications">
            <div class="notification-badge-sidebar">
                <span>🔔 Notificações</span>
                <span class="notification-count">0</span>
            </div>
        </div>
    </aside>
    
    <main class="main-content">
        <div class="top-bar">
            <button class="menu-toggle" id="menuToggle" onclick="toggleSidebar()">☰</button>
            <button class="theme-toggle" onclick="toggleDarkMode()">🌙</button>
        </div>
        
        <div class="content-area">
            <div class="cadastro-card">
                <h1 style="text-align: center;">Cadastro de Equipe</h1>
                <form id="cadastroEquipeForm">
                    <div class="form-group">
                        <label>Nome da Equipe *</label>
                        <input type="text" id="nomeEquipe" required>
                    </div>
                    <div class="form-group">
                        <label>Email Institucional *</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label>Senha *</label>
                        <input type="password" id="senha" required>
                    </div>
                    <div class="form-group">
                        <label>Tipo de Organização *</label>
                        <select id="tipoOrganizacao" required>
                            <option value="">Selecione</option>
                            <option value="Clube Profissional">Clube Profissional</option>
                            <option value="Clube Amador">Clube Amador</option>
                            <option value="Escola/Projeto Social">Escola/Projeto Social</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Localização *</label>
                        <input type="text" id="localizacao" placeholder="Cidade / UF" required>
                    </div>
                    <div class="form-group">
                        <label>Descrição</label>
                        <textarea id="descricao" rows="3" placeholder="Conte um pouco sobre sua equipe..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Cadastrar Equipe</button>
                </form>
                <p style="text-align: center; margin-top: 1rem;">
                    É um atleta? <a href="cadastro_atleta.html">Cadastre-se como atleta</a><br>
                    Já tem conta? <a href="login.html">Faça Login</a>
                </p>
            </div>
        </div>
        
        <div class="footer">
            <div class="credit">Sport Match © 2024 - Conectando atletas e equipes</div>
        </div>
    </main>
</div>

<script src="../js/sessao.js"></script>
<script src="../js/menu-lateral.js"></script>
<script src="../js/cadastro_equipe.js"></script>
</body>
</html>
